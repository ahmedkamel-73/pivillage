  <script>
const { createElement: h, useState, useEffect, useRef } = React;

const API = {
  token: () => localStorage.getItem('pi_token') || '',
  async request(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    const t = API.token();
    if (t) headers['Authorization'] = `Bearer ${t}`;
    const res = await fetch(path, { ...options, headers });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  },
  get: (p) => API.request(p, { method: 'GET' }),
  post: (p, b) => API.request(p, { method: 'POST', body: JSON.stringify(b || {}) }),
};

// ✅ مكوّن منفصل للمكعب
function Cube({ color, top, left }) {
  return h('div', {
    className: 'absolute',
    style: { top, left }
  },
    h('div', {
      className: 'relative w-[108px] h-[108px] rounded-[16px] grid place-items-center cursor-pointer transition-all duration-300 hover:scale-[1.05]',
      style: {
        background: color,
        border: '2px dashed rgba(255,255,255,0.15)',
      }
    }, [
      h('div', { key: 'q', className: 'text-[42px] font-black text-white/25' }, '؟'),
      h('div', { key: 'l', className: 'text-[10px] font-bold text-white/30 mt-1' }, 'بانتظار'),
    ])
  );
}

// ✅ دالة كشف بيئة Pi Browser بدقة
function detectPiEnvironment() {
  const ua = navigator.userAgent || '';
  const inPiBrowser = /PiBrowser|Pi Browser/i.test(ua);
  const hasPiSDK = typeof window.Pi !== 'undefined';
  const hasAuth = typeof window.Pi?.authenticate === 'function';
  return { inPiBrowser, hasPiSDK, hasAuth, ua };
}

function PiVillage() {
  const [showHero, setShowHero] = useState(true);
  const [countdown, setCountdown] = useState(5);
  const [authed, setAuthed] = useState(false);
  const [username, setUsername] = useState('');
  const [userId, setUserId] = useState('');
  const [toast, setToast] = useState('');
  const [adsAvailable, setAdsAvailable] = useState(null);

  const [shops, setShops] = useState([]);
  const [sections, setSections] = useState([]);
  const [loading, setLoading] = useState(true);

  const [showCreateShop, setShowCreateShop] = useState(false);
  const [newShop, setNewShop] = useState({ name: '', section_name: '', description: '' });
  const [creating, setCreating] = useState(false);

  const [showProductModal, setShowProductModal] = useState(false);
  const [activeShop, setActiveShop] = useState(null);
  const [products, setProducts] = useState([]);
  const [newProduct, setNewProduct] = useState({ name: '', price_pi: '', stock: '', description: '' });

  const [showBuyModal, setShowBuyModal] = useState(false);
  const [buyProduct, setBuyProduct] = useState(null);
  const [buying, setBuying] = useState(false);

  const marketRef = useRef(null);

  const showToast = (msg, ms = 3000) => {
    setToast(msg);
    if (ms > 0) setTimeout(() => setToast(''), ms);
  };

  useEffect(() => {
    // كشف البيئة في الكونسول عشان تسهّل التشخيص
    const env = detectPiEnvironment();
    console.log('🔍 Pi Environment:', env);

    try {
      if (window.Pi) {
        window.Pi.init({ version: '2.0', sandbox: false });
        if (window.Pi.nativeFeaturesList) {
          window.Pi.nativeFeaturesList()
            .then(list => setAdsAvailable(list.includes('ad_network')))
            .catch(() => setAdsAvailable(false));
        }
      }
    } catch (e) { console.warn('Pi init failed', e); }

    const savedToken = localStorage.getItem('pi_token');
    const savedUser = localStorage.getItem('pi_username');
    const savedId = localStorage.getItem('user_id');
    if (savedToken && savedUser) {
      setAuthed(true);
      setUsername(savedUser);
      setUserId(savedId || '');
    }

    loadShops();
    loadSections();

    const timer = setInterval(() => {
      setCountdown(c => c <= 1 ? 0 : c - 1);
    }, 1000);
    const hideHero = setTimeout(() => {
      setShowHero(false);
      showToast('تم نقلك تلقائياً إلى شوارع القرية ↓');
    }, 5000);

    return () => { clearInterval(timer); clearTimeout(hideHero); };
  }, []);

  async function loadShops() {
    setLoading(true);
    try {
      const data = await API.get('/api/shops');
      setShops(data.shops || []);
    } catch (e) { console.error('loadShops', e); }
    finally { setLoading(false); }
  }

  async function loadSections() {
    try {
      const data = await API.get('/api/sections');
      setSections(data.sections || []);
    } catch (e) { console.error('loadSections', e); }
  }

  // ✅ نسخة محسّنة من loginPi
  async function loginPi() {
    console.log('🔵 loginPi triggered');

    const env = detectPiEnvironment();
    console.log('   Environment:', env);

    // 1. تحقق إن إحنا جوه Pi Browser
    if (!env.inPiBrowser) {
      console.warn('❌ Not in Pi Browser. UA:', env.ua);
      showToast('⚠️ افتح التطبيق من متصفح Pi الرسمي', 5000);
      return;
    }

    // 2. تحقق إن SDK محمّل
    if (!env.hasPiSDK || !env.hasAuth) {
      console.error('❌ Pi SDK not loaded:', env);
      showToast('❌ Pi SDK مش محمّل صح، حاول تحدّث الصفحة', 5000);
      return;
    }

    // 3. جرب الدخول
    try {
      console.log('🟡 Calling Pi.authenticate...');
      const auth = await window.Pi.authenticate(
        ['username', 'payments', 'wallet_address'],
        (payment) => {
          console.log('⚠️ Incomplete payment found:', payment);
          fetch('/pi/complete', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${API.token()}`,
            },
            body: JSON.stringify({
              paymentId: payment.identifier,
              orderId: payment.metadata?.orderId,
              txid: payment.transaction?.txid,
            }),
          }).catch(console.error);
        }
      );

      console.log('🟢 Auth success:', auth);

      const res = await API.post('/api/auth', {
        pi_uid: auth.user.uid,
        pi_username: auth.user.username,
        pi_access_token: auth.accessToken,
      });

      console.log('🟢 Server response:', res);

      localStorage.setItem('pi_token',    res.session_token || auth.accessToken);
      localStorage.setItem('pi_username', auth.user.username);
      localStorage.setItem('user_id',     res.user.id);

      setAuthed(true);
      setUsername(auth.user.username);
      setUserId(res.user.id);
      showToast(`🎉 أهلاً ${auth.user.username} في قرية Pi!`);
      loadShops();
    } catch (e) {
      console.error('❌ Login error:', e);
      const msg = e?.message || e?.error || JSON.stringify(e);
      showToast('فشل تسجيل الدخول: ' + msg, 5000);
    }
  }

  async function createShop() {
    if (!authed) { showToast('سجل الدخول أولاً'); return; }
    if (!newShop.name.trim() || !newShop.section_name.trim()) {
      showToast('اكتب اسم المحل والقسم');
      return;
    }
    setCreating(true);
    try {
      const shop = await API.post('/api/shops', {
        name: newShop.name.trim(),
        section_name: newShop.section_name.trim(),
        description: newShop.description.trim(),
      });
      showToast(`تم إنشاء محلك: ${shop.name} ✅`);
      setShowCreateShop(false);
      setNewShop({ name: '', section_name: '', description: '' });
      await loadShops();
      await loadSections();
    } catch (e) {
      showToast('خطأ: ' + e.message);
    } finally { setCreating(false); }
  }

  async function openShop(shop) {
    setActiveShop(shop);
    setShowProductModal(true);
    setProducts([]);
    try {
      const data = await API.get(`/api/products?shop_id=${encodeURIComponent(shop.id)}`);
      setProducts(data.products || []);
    } catch (e) { showToast('تعذر تحميل المنتجات'); }
  }

  async function addProduct() {
    if (!activeShop) return;
    if (!newProduct.name.trim() || !newProduct.price_pi) {
      showToast('اكتب اسم المنتج والسعر');
      return;
    }
    try {
      const product = await API.post('/api/products', {
        shop_id: activeShop.id,
        name: newProduct.name.trim(),
        price_pi: parseFloat(newProduct.price_pi),
        stock: parseInt(newProduct.stock || '0', 10),
        description: newProduct.description.trim(),
      });
      showToast('تم إضافة المنتج ✅');
      setProducts(prev => [product, ...prev]);
      setNewProduct({ name: '', price_pi: '', stock: '', description: '' });
    } catch (e) { showToast('خطأ: ' + e.message); }
  }

  async function buyWithPi(product) {
    if (!authed) { showToast('سجل الدخول أولاً'); loginPi(); return; }
    setBuying(true);
    try {
      const order = await API.post('/api/orders', {
        shop_id: activeShop.id,
        items: [{ product_id: product.id, quantity: 1 }],
      });

      await window.Pi.createPayment({
        amount: Number(order.total_pi),
        memo: `قرية Pi — طلب ${order.order_id}`,
        metadata: { orderId: order.order_id, productId: product.id },
      }, {
        onReadyForServerApproval: async (paymentId) => {
          try { await API.post('/pi/approve', { paymentId, orderId: order.order_id }); }
          catch (e) { console.error('approve failed', e); }
        },
        onReadyForServerCompletion: async (paymentId, txid) => {
          try {
            await API.post('/pi/complete', { paymentId, orderId: order.order_id, txid });
            showToast('تم الدفع ✅ — المبلغ في الضمان');
          } catch (e) { console.error('complete failed', e); }
        },
        onCancel: () => showToast('تم إلغاء الدفع'),
        onError: (err) => showToast('خطأ في الدفع: ' + (err?.message || '')),
      });
    } catch (e) {
      showToast('فشل الشراء: ' + e.message);
    } finally {
      setBuying(false);
      setShowBuyModal(false);
    }
  }

            className: 'h-11 flex-1 rounded-xl bg-white/5 text-[13px] font-bold'
          }, 'إلغاء'),
          h('button', {
            key: 'ok',
            onClick: createShop,
            disabled: creating,
            className: 'h-11 flex-[1.3] rounded-xl bg-[#f9a826] text-[#0f0f1a] font-black text-[13px] disabled:opacity-50'
          }, creating ? 'جار الإنشاء…' : 'إنشاء المحل ✅'),
        ]),
      ]),
    ]),

    // ===== PRODUCTS MODAL =====
    showProductModal && activeShop && h('div', {
      key: 'pm',
      className: 'fixed inset-0 z-[60] flex items-center justify-center p-4'
    }, [
      h('div', {
        key: 'bg',
        onClick: () => setShowProductModal(false),
        className: 'absolute inset-0 bg-black/50 backdrop-blur'
      }),
      h('div', {
        key: 'box',
        className: 'relative w-full max-w-[520px] max-h-[80vh] overflow-y-auto rounded-[20px] bg-[#181828] border border-white/10 p-6 shadow-2xl'
      }, [
        h('div', { key: 'h', className: 'flex items-center justify-between mb-4' }, [
          h('h3', { key: 't', className: 'text-[18px] font-black' }, activeShop.name),
          h('button', {
            key: 'c',
            onClick: () => setShowProductModal(false),
            className: 'w-8 h-8 rounded-full bg-white/5 text-white/60'
          }, '✕'),
        ]),
        activeShop.owner_id === userId && h('div', {
          key: 'add',
          className: 'rounded-xl border border-[#f9a826]/20 bg-[#f9a826]/[0.04] p-4 mb-4'
        }, [
          h('div', { key: 't', className: 'text-[12px] font-bold text-[#f9a826] mb-2' }, '➕ أضف منتج جديد'),
          h('input', {
            key: 'n',
            placeholder: 'اسم المنتج',
            value: newProduct.name,
            onChange: e => setNewProduct(p => ({ ...p, name: e.target.value })),
            className: 'w-full h-10 rounded-lg bg-[#0f0f1a] border border-white/10 px-3 text-[13px] outline-none focus:border-[#f9a826]/50 mb-2'
          }),
          h('div', { key: 'row', className: 'flex gap-2' }, [
            h('input', {
              key: 'p',
              type: 'number',
              step: '0.01',
              placeholder: 'السعر بـ π',
              value: newProduct.price_pi,
              onChange: e => setNewProduct(p => ({ ...p, price_pi: e.target.value })),
              className: 'flex-1 h-10 rounded-lg bg-[#0f0f1a] border border-white/10 px-3 text-[13px] outline-none focus:border-[#f9a826]/50'
            }),
            h('input', {
              key: 's',
              type: 'number',
              placeholder: 'المخزون',
              value: newProduct.stock,
              onChange: e => setNewProduct(p => ({ ...p, stock: e.target.value })),
              className: 'flex-1 h-10 rounded-lg bg-[#0f0f1a] border border-white/10 px-3 text-[13px] outline-none focus:border-[#f9a826]/50'
            }),
          ]),
          h('button', {
            key: 'b',
            onClick: addProduct,
            className: 'w-full h-10 mt-2 rounded-lg bg-[#f9a826] text-[#0f0f1a] font-bold text-[13px]'
          }, 'إضافة المنتج'),
        ]),
        products.length === 0
          ? h('div', { key: 'e', className: 'text-center py-6 text-white/40 text-[13px]' }, 'لا توجد منتجات بعد')
          : h('div', { key: 'l', className: 'space-y-2' },
              products.map(p => h('div', {
                key: p.id,
                className: 'flex items-center justify-between rounded-xl bg-white/5 border border-white/10 p-3'
              }, [
                h('div', { key: 'l' }, [
                  h('div', { key: 'n', className: 'font-bold text-[14px]' }, p.name),
                  h('div', { key: 'd', className: 'text-[11px] text-white/50' }, p.description || ''),
                ]),
                h('div', { key: 'r', className: 'flex items-center gap-2' }, [
                  h('div', {
                    key: 'p',
                    className: 'flex items-center gap-1 bg-[#0f0f1a] text-[#f9a826] rounded-full px-2.5 py-1 text-[12px] font-bold'
                  }, ['π ', p.price_pi]),
                  h('button', {
                    key: 'b',
                    onClick: () => { setBuyProduct(p); setShowBuyModal(true); },
                    className: 'h-8 px-3 rounded-full bg-[#f9a826] text-[#0f0f1a] text-[12px] font-bold'
                  }, 'شراء'),
                ]),
              ]))),
      ]),
    ]),

    // ===== BUY MODAL =====
    showBuyModal && buyProduct && h('div', {
      key: 'bm',
      className: 'fixed inset-0 z-[70] flex items-center justify-center p-4'
    }, [
      h('div', {
        key: 'bg',
        onClick: () => !buying && setShowBuyModal(false),
        className: 'absolute inset-0 bg-black/60 backdrop-blur'
      }),
      h('div', {
        key: 'box',
        className: 'relative w-full max-w-[400px] rounded-[20px] bg-[#181828] border border-white/10 p-6 shadow-2xl text-center'
      }, [
        h('div', { key: 'i', className: 'text-[48px] mb-2' }, '🛒'),
        h('h3', { key: 'n', className: 'text-[16px] font-black mb-1' }, buyProduct.name),
        h('div', { key: 'p', className: 'flex items-center justify-center gap-1 text-[28px] font-black text-[#f9a826] mb-4' },
          ['π ', buyProduct.price_pi]),
        h('p', { key: 'w', className: 'text-[12px] text-white/50 mb-5 leading-6' },
          'سيتم حجز المبلغ في محفظة الضمان حتى تؤكد الاستلام.'),
        h('div', { key: 'bt', className: 'flex gap-3' }, [
          h('button', {
            key: 'c',
            onClick: () => setShowBuyModal(false),
            disabled: buying,
            className: 'h-11 flex-1 rounded-xl bg-white/5 text-[13px] font-bold'
          }, 'إلغاء'),
          h('button', {
            key: 'ok',
            onClick: () => buyWithPi(buyProduct),
            disabled: buying,
            className: 'h-11 flex-[1.3] rounded-xl bg-[#f9a826] text-[#0f0f1a] font-black text-[13px] disabled:opacity-50'
          }, buying ? 'جار الدفع…' : 'ادفع بـ π'),
        ]),
      ]),
    ]),
  ]);
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(PiVillage)
);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
